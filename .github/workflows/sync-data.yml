name: Sync dashboard data

# 职责：定时用飞书开放平台接口读取多维表 -> 生成 data.json
# 看板（dashboard/index.html）每 5 分钟自行重新读取 data.json，实现自动刷新。
#
# 前置配置：
#   Settings -> Secrets and variables -> Actions 添加：
#     LARK_APP_ID      = cli_xxxxxxxx
#     LARK_APP_SECRET  = 应用密钥
#   并把该应用添加为多维表协作者（可阅读）

on:
  schedule:
    # 每 5 分钟同步一次（GitHub Actions 支持的最小间隔）
    # 注意：高峰期可能有数分钟排队延迟，属平台特性
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dashboard-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check secrets present
        env:
          LARK_APP_ID: ${{ secrets.LARK_APP_ID }}
          LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
        run: |
          if [ -z "$LARK_APP_ID" ] || [ -z "$LARK_APP_SECRET" ]; then
            echo "::error::缺少 LARK_APP_ID / LARK_APP_SECRET"
            exit 1
          fi
          echo "凭证已配置"

      - name: Build data.json from Base
        env:
          LARK_APP_ID: ${{ secrets.LARK_APP_ID }}
          LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
        run: python build_data.py

      - name: Verify output
        run: |
          test -f data.json || { echo "::error::data.json 未生成"; exit 1; }
          python - <<'PY'
          import json, sys
          d = json.load(open('data.json', encoding='utf-8'))
          required = [
              "updated_at","kpi.progress.total_sites","kpi.progress.region_count",
              "kpi.progress.overall_rate","kpi.plan.total_tasks","kpi.plan.site_count",
              "kpi.plan.supplier_count","progress.regions","progress.funnel",
              "progress.records","plan.status_dist","plan.region_dist",
          ]
          def get(o, p):
              for k in p.split('.'):
                  if not isinstance(o, dict) or k not in o: return None
                  o = o[k]
              return o
          miss = [p for p in required if get(d, p) is None]
          if miss:
              print("::error::契约缺失字段: " + ", ".join(miss)); sys.exit(1)
          print(f"契约校验通过 12/12，{len(get(d,'progress.records') or [])} 个站点，更新于 {d['updated_at']}")
          PY

      - name: Guard - no secrets in output
        run: |
          if grep -rniE 'app_secret|tenant_access_token|cli_[a-z0-9]{10,}|\bsecret\b' index.html data.json 2>/dev/null; then
            echo "::error::发布产物中检测到疑似凭证"; exit 1
          fi
          echo "凭证检查通过"

      - name: Commit refreshed data.json
        run: |
          cd ..
          if git diff --quiet -- dashboard/data.json; then
            echo "data.json 无变化，跳过提交"
          else
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add dashboard/data.json
            git commit -m "chore: 同步看板数据 $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
